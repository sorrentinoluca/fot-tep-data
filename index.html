<script>
"use strict";

const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v);}for(const k of kids.flat()){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(String(k)));}return e;}

const sleep=ms=>new Promise(r=>setTimeout(r,RM?0:ms));
const f3=x=>(x>=0?"+":"−")+Math.abs(x).toFixed(3);
const f5=x=>(x>=0?"+":"−")+Math.abs(x).toFixed(5);

// ------------------------------------------------------------ historical Studio 2 helpers (ported 29 Sep 2026)
// Schematic drawing helpers for the historical steps; every signal is synthetic and labelled schematic.
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(r){let u=0;while(!u)u=r();const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function pathOf(p){return p.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join("");}
function calm(seed,n,x0,x1,yc,amp){const r=mulberry(seed);const ph=r()*6,pts=[];for(let i=0;i<n;i++){const x=x0+(x1-x0)*i/(n-1);const y=yc+amp*(0.55*Math.sin(i*0.23+ph)+0.3*Math.sin(i*0.061+2*ph)+0.22*gauss(r));pts.push([x,y]);}return pts;}

// ------------------------------------------------------------ steps
const STEPS=[];function S(o){STEPS.push(o);}

// 0 — prologue
S({ph:"Introduzione · La domanda",title:"Un impianto, otto client, un guasto ciascuno",task:"scegli un client e scopri che cosa conosce.",
why:"Ogni client ha esperienza diagnostica di una sola classe di guasto e del funzionamento normale. Lo studio chiede se brevi frasi verificate scritte dagli altri client gli consentano di riconoscere i sette guasti mai osservati e se questa soluzione superi una semplice alternativa numerica.",
doc:"question",
build(api){
  const grid=h("div",{class:"grid g8",role:"group","aria-label":"Client"});
  const out=h("div",{class:"lead"},"Scegli un client.");
  const tiles=CLASSES.map(c=>h("button",{type:"button",class:"tile","aria-pressed":"false",onclick:()=>pick(c)},h("b",{},"C_"+c),h("small",{},"è titolare di "+c)));
  tiles.forEach(t=>grid.append(t));
  function pick(c){tiles.forEach((t,i)=>{t.setAttribute("aria-pressed",CLASSES[i]===c);t.classList.toggle("own",CLASSES[i]===c);t.classList.toggle("unseen",CLASSES[i]!==c);});
    out.replaceChildren(h("span",{},"Il client "),h("b",{class:"mono"},"C_"+c),h("span",{}," conosce "),h("b",{},c+" e Normal"),h("span",{},". Gli altri sette guasti sono "),h("b",{},"local-unseen"),h("span",{}," per lui, cioè mai osservati localmente. Nelle condizioni con conoscenza dei pari riceve gli insight verificati degli altri sette client, mai quello della propria classe."));api.done();}
  return [badge("schem","scenario schematico"),grid,out,h("p",{class:"small"},"Le nove etichette possibili per ciascun metodo di diagnosi (i cinque bracci LLM e PROTO) sono F1, F2, F3, F8, F10, F13, F14, F15 e Normal; è ammessa anche l’astensione. ",docLink("conditions","Condizioni nella documentazione"))];
}});

// ---- passaggi storici dello Studio 2, riportati il 29 settembre 2026 da ../../fot-tep/docs/esperienza_interattiva_studio2.html
// Collocati prima della fase attuale che li riusa. Tutti i segnali sono schematici; i numeri sono le
// misure storiche dello Studio 2 (sezioni #s2-f02 … #s2-f03-9 della documentazione), mai evidenza del nuovo test.
const HIST="storico · Studio 2";

// H1 — Fase 02 · 1 ricetta
S({ph:"Studio 2 · Fase 02 · 1 La ricetta",title:"La ricetta di simulazione (storica, riusata da P03)",task:"fissa per iscritto i parametri e avvia l’impianto.",
why:"Se la ricetta non è scritta, fra sei mesi rigenerando i dati uscirebbero numeri diversi e nulla sarebbe difendibile. L’adattatore P03 dello studio attuale integra esattamente questa ricetta: scatto dei controllori di 1.8 s, un campione al minuto, burn-in di 20 ore, finestre da 5 ore.",
doc:"s2-f02-recipe",
build(api){
  const say=sayBox();
  const rows=[["Passo dei controllori","Ts_base","I controllori stabilizzano l’impianto aprendo e chiudendo le valvole. Sono digitali: agiscono a scatti.","1.8 s","Hai fissato Ts_base: ogni 1.8 s i controllori leggono le misure e muovono le valvole. Se scattassero più o meno spesso, l’impianto si comporterebbe in modo leggermente diverso e i dati «normali» cambierebbero."],
    ["Dati salvati","Ts_save","Le equazioni dell’impianto evolvono di continuo (il solutore sceglie da solo i suoi passi); su disco va un campione ogni tanto.","1 al minuto","Hai fissato Ts_save = 1/60 h: si salva un campione al minuto, circa uno ogni 33 interventi dei controllori. È la granularità di tutte le fasi successive."],

S({ph:"P10.1–P10.2 · Comparatori (post hoc)",title:"Che cosa otterrebbero i modelli classici sugli stessi 96 casi?",
task:"scegli un endpoint e una modalità, poi leggi le barre rispetto ai due ancoraggi fissi.",
why:"Il test prespecificato ha fissato un solo comparatore numerico, PROTO. Queste tredici ricette sono state applicate agli stessi 96 casi sigillati in un secondo momento, quando gli esiti a sei condizioni erano già noti: sono quindi contesto e non un verdetto, senza valore p, senza appartenenza alla famiglia Holm, senza affermazioni di equivalenza e senza classifica. Due aspetti richiedono attenzione. FEDAVG e CENTRAL sono indipendenti dal ricevente, quindi i loro tassi su local-unseen e local-seen sono uguali per costruzione: aritmetica, non un risultato. Un modello LOCAL è addestrato su due sole etichette, il proprio guasto e Normal, ma la sua testa non è mascherata e 71 delle 42,240 etichette emesse da LOCAL in P10.2 cadono fuori da quella coppia; la sua accuratezza quasi nulla su local-unseen è un esito osservato a parte, non una stima causale del costo di non condividere nulla.",
doc:"comparator-accuracy",
build(api){
  let ep="local_unseen", mode="CENTRAL";
  const say=sayBox();
  const epBtns=PH_EPS.map(([k,l])=>h("button",{type:"button",class:"btn sm","aria-pressed":k===ep,onclick:()=>{ep=k;upd();}},l));
  const mdBtns=PH_MODES.map(([k,l])=>h("button",{type:"button",class:"btn sm","aria-pressed":k===mode,onclick:()=>{mode=k;upd();}},k));
  const box=h("div",{class:"grid"});
  const note=h("p",{class:"small"});
  function anchorRow(name){
    const a=PH.anchors[name][ep];
    return h("div",{class:"kv"},
      h("span",{},h("b",{},name),h("small",{}," ancoraggio · "+a.correct+"/"+a.n+" · "+pct(a.acc)+" · astensioni "+a.abstain+" · non valide "+a.invalid)),
      h("div",{class:"bar",role:"img","aria-label":name+", ancoraggio sigillato di P10: "+a.correct+" corrette su "+a.n+", "+pct(a.acc)+", "+a.abstain+" astensioni, "+a.invalid+" non valide"},
        h("i",{class:"anchor",style:"width:"+(100*a.acc)+"%"})));
  }
  function upd(){
    epBtns.forEach((b,i)=>b.setAttribute("aria-pressed",PH_EPS[i][0]===ep));
    mdBtns.forEach((b,i)=>b.setAttribute("aria-pressed",PH_MODES[i][0]===mode));
    const rows=(PH.acc[mode]||{})[ep]||[];
    const kids=[anchorRow("B0"),anchorRow("PROTO")];
    rows.forEach(r=>{
      const detFlag=PH_DET.has(r.recipe+"/"+mode);
      const lab=r.phase+" · "+r.recipe;
      kids.push(h("div",{class:"kv"},
        h("span",{},h("b",{},r.recipe),h("small",{}," "+r.phase+" · "+pct(r.mean)+" \u00b1 "+(100*r.sd).toFixed(1)),
          detFlag?h("small",{title:"tutti e cinque i seed sono identici byte per byte sul modello addestrato e sull\u2019intera vista dei punteggi: un\u2019enumerazione deterministica ripetuta cinque volte, non cinque replicazioni"}," · det."):null),
        h("div",{class:"bar",role:"img","aria-label":lab+" in modalità "+mode+" su "+ep+": media sui seed "+pct(r.mean)+", sd campionaria "+(100*r.sd).toFixed(1)+" punti su cinque seed"+(detFlag?", enumerazione deterministica su cinque seed":"")},
          h("i",{style:"width:"+(100*r.mean)+"%"}))));
    });
    box.replaceChildren(...kids);
    const bits=[];
    if(mode!=="LOCAL")bits.push("FEDAVG e CENTRAL sono indipendenti dal ricevente: i loro tassi su local-unseen e local-seen sono uguali per costruzione, quindi passare da un endpoint all\u2019altro non può muovere queste barre.");
    else bits.push("LOCAL si addestra su due sole etichette (proprio guasto + Normal). Delle 42,240 etichette emesse dalle esecuzioni LOCAL di P10.2, 71 cadono fuori da {Normal, proprio guasto}; P10.1 ne emette 0 su 7,680.");
    if(mode==="CENTRAL")bits.push("CENTRAL aggrega tutte le 640 finestre di sviluppo: è un riferimento centralizzato esterno alla regola di accesso dello studio, non un limite superiore alle prestazioni.");
    if([...PH_DET].some(k=>k.endsWith("/"+mode)))bits.push("Le righe contrassegnate «det.» hanno cinque seed identici byte per byte — k-NN e XGBoost, 90 dei 525 job, 17 modelli addestrati distinti — quindi la loro dispersione nulla è enumerazione, non accordo fra replicazioni.");
    note.replaceChildren(bits.join(" "));
    say.say("Modalità "+mode+" su "+PH_EPS.find(e=>e[0]===ep)[1]+": "+rows.length+" ricette accanto ai due ancoraggi fissi.");
    api.done();
  }
  upd();
  return [badge("est","post hoc · P10.1/P10.2 · descrittivo, soltanto estimativo · non presente in view_data.js"),

      h("button",{type:"button",class:"link",onclick:()=>go(STEPS.length-1)},"Vai alla fine"),
      s.doc?docLink(s.doc,"Approfondisci"):null));
  app.replaceChildren(step);
  step.querySelector("h2").focus({preventScroll:false});
  try{history.replaceState(null,"","#step-"+(i+1));}catch(e){}
}
function go(i){if(i<0||i>=STEPS.length)return;render(i);window.scrollTo({top:0,behavior:RM?"auto":"smooth"});}
document.addEventListener("keydown",e=>{const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="SELECT"||t.tagName==="TEXTAREA"))return;if(e.key==="ArrowRight"){e.preventDefault();go(cur+1);}else if(e.key==="ArrowLeft"){e.preventDefault();go(cur-1);}});
if(!D){app.replaceChildren(h("section",{class:"step"},h("h2",{},"Dati di visualizzazione non caricati"),h("p",{class:"lead"},"Questa pagina legge i valori misurati da study2_assets/view_data.js nella cartella adiacente. Conserva il file accanto a questo HTML (è generato da orchestrator/claude/P11/build_p11_derivatives.py) e ricarica la pagina.")));}
else{
  const m=(location.hash||"").match(/#step-(\d+)/);const start=m?Math.min(STEPS.length,Math.max(1,+m[1]))-1:0;render(start);
}
</script>
